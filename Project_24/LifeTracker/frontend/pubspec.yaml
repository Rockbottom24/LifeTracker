name: lifetracker
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  mobile_scanner: ^7.0.1
  cupertino_icons: ^1.0.8

  provider: ^6.1.5
  dio: ^5.9.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  intl: ^0.20.2

  flutter_local_notifications: ^19.4.2

  timezone: ^0.10.1
  flutter_timezone: ^5.1.0
  hive_flutter: ^1.1.0
  fl_chart: ^0.70.2

  # ── Local-first migration packages ──────────────────────────────────────────
  # SQLite ORM with reactive streams and type-safe queries
  drift: ^2.22.1
  drift_flutter: ^0.2.4
  # File system paths for the local DB file
  path_provider: ^2.1.5
  path: ^1.9.1
  # Google Sign-In (replaces JWT auth)
  google_sign_in: ^6.2.2
  # Google Drive API for cloud backup/sync
  googleapis: ^13.2.0
  http: ^1.2.2
  # Online/offline detection
  connectivity_plus: ^6.1.1
  # UUID generation for local records
  uuid: ^4.5.1
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

  # ── Drift code generation ───────────────────────────────────────────────────
  drift_dev: ^2.22.1
  build_runner: ^2.4.14

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
